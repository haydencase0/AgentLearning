[project]
name = "langchain-starter-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.3",
    "langchain[mcp]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "rich>=15.0.0",
    "uuid>=1.30",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
